version = 1

[agent]
tool           = "opencode"
prompt_file    = "prompts/task.md"
max_iterations = 3
llm_env        = "OPENCODE_GO_SUBSCRIPTION_KEY"
command        = ["opencode", "run", "--model", "opencode-go/deepseek-v4.1-flash", "{{prompt}}"]

[setup]
script = "setup.sh"

[verify]
script = "verify.sh"

[pr]
branch_prefix = "fleet/"
base          = "development"
title         = "{{issue.key}}: {{issue.summary}}"
labels        = ["agent"]
body_file     = "pr-template.md"

[platform]
os       = "linux"
requires = []
arch     = "amd64"

[coi]
profile = "fleet-flutter-3.24"
network = "restricted"
timeout = "60m"

[comment]
enabled = true
mode    = "auto"
reply   = true
